[project]
name = "udx-payments-api"
version = "0.2.0"
description = "Backend da UDX Solucoes de Pagamentos"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.5,<3.0",
  "email-validator>=2.2,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "redis>=5.0,<6.0",
  "python-jose[cryptography]>=3.3,<4.0",
  "cryptography>=43,<47",
  "passlib[bcrypt]>=1.7,<2.0",
  "bcrypt>=4.0,<5.0",
  "pyotp>=2.9,<3.0",
  "httpx>=0.27,<1.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.6,<1.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
