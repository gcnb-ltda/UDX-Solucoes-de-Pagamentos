name: Test Build v0.2 — 114 Screens

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ui-114-screens

permissions:
  contents: read

jobs:
  web:
    name: Web test bundle — 114 screens
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm audit --audit-level=high
      - run: npm run build:web
        env:
          NEXT_PUBLIC_API_URL: https://api-test.udxbanco.com.br/api/v1
      - name: Verify 114 exported screens
        run: |
          count=$(find out/screens -mindepth 1 -maxdepth 1 -type d -name 'tela-*' | wc -l)
          echo "Exported screen directories: $count"
          test "$count" -eq 114
      - uses: actions/upload-artifact@v4
        with:
          name: udx-pay-web-v0.2.0-test-114-screens
          path: frontend/out
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android APK test — 114 screens
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - run: npm audit --audit-level=high
      - run: npm run build:web
        env:
          NEXT_PUBLIC_API_URL: https://api-test.udxbanco.com.br/api/v1
      - name: Verify 114 exported screens
        run: |
          count=$(find out/screens -mindepth 1 -maxdepth 1 -type d -name 'tela-*' | wc -l)
          echo "Exported screen directories: $count"
          test "$count" -eq 114
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ../UDX-Pay-v0.2.0-test-114-screens-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: udx-pay-android-v0.2.0-test-114-screens
          path: UDX-Pay-v0.2.0-test-114-screens-debug.apk
          if-no-files-found: error
          retention-days: 30
