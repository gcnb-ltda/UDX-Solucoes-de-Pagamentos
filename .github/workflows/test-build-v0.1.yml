name: Test Build v0.1

on:
  workflow_dispatch:
  push:
    branches:
      - feature/test-build-v0.1

permissions:
  contents: read

jobs:
  web:
    name: Web test bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm audit --audit-level=high
      - run: npm run build:web
        env:
          NEXT_PUBLIC_API_URL: https://api-test.udxbanco.com.br/api/v1
      - uses: actions/upload-artifact@v4
        with:
          name: udx-pay-web-v0.1.0-test
          path: frontend/out
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android APK test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - run: npm audit --audit-level=high
      - run: npm run build:web
        env:
          NEXT_PUBLIC_API_URL: https://api-test.udxbanco.com.br/api/v1
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ../UDX-Pay-v0.1.0-test-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: udx-pay-android-v0.1.0-test
          path: UDX-Pay-v0.1.0-test-debug.apk
          if-no-files-found: error
          retention-days: 30
