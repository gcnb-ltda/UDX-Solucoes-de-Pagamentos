name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: udx_payments
          POSTGRES_USER: udx
          POSTGRES_PASSWORD: udx
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U udx -d udx_payments"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      APP_SECRET_KEY: test-secret-key-with-more-than-32-characters
      BOOTSTRAP_TOKEN: test-bootstrap-token
      DATABASE_URL: postgresql+psycopg://udx:udx@localhost:5432/udx_payments
      REDIS_URL: redis://localhost:6379/0
      API_V1_PREFIX: /api/v1
      CORS_ORIGINS: http://localhost:3000
      SECRET_PROVIDER: env
      DATA_ENCRYPTION_KEY: test-data-encryption-key-with-more-than-32-characters
      JWT_ALGORITHM: HS256
      JWT_ISSUER: udx-payments
      JWT_AUDIENCE: udx-payments-api
      JWT_ACCESS_MINUTES: 15
      JWT_REFRESH_DAYS: 7
      JWT_MFA_CHALLENGE_MINUTES: 5
      JWT_ACTIVE_KID: v2
      JWT_KEYS_JSON: '{"v1":"old-test-jwt-key-with-more-than-32-characters","v2":"active-test-jwt-key-with-more-than-32-characters"}'
      AUTH_LOGIN_RATE_LIMIT: 10
      AUTH_LOGIN_RATE_WINDOW_SECONDS: 60
      AUTH_MFA_RATE_LIMIT: 8
      AUTH_MFA_RATE_WINDOW_SECONDS: 300
      AUTH_LOCK_THRESHOLD: 5
      AUTH_LOCK_MAX_MINUTES: 60
      ALLOW_MANUAL_SETTLEMENT: true
      PAYMENT_PROVIDER: mock
      PAYMENT_PROVIDER_WEBHOOK_SECRET: test-webhook-secret-with-more-than-32-characters
      WEBHOOK_REPLAY_WINDOW_SECONDS: 300
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --upgrade pip
      - run: pip install '.[dev]'
      - run: ruff check .
      - run: python -m compileall -q app
      - run: alembic upgrade head
      - run: pytest -q

  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --upgrade pip
      - run: pip install '.[security]'
      - run: bandit -q -r app -x app/core/config.py
      - name: Dependency vulnerability audit
        run: pip-audit --desc

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm audit --audit-level=high
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t udx-payments-api:test ./backend
      - run: docker build -t udx-payments-web:test ./frontend
