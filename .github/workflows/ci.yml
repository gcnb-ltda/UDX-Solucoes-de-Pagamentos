name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: udx_payments
          POSTGRES_USER: udx
          POSTGRES_PASSWORD: udx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U udx -d udx_payments"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      APP_SECRET_KEY: test-secret-key-with-more-than-32-characters
      BOOTSTRAP_TOKEN: test-bootstrap-token
      DATABASE_URL: postgresql+psycopg://udx:udx@localhost:5432/udx_payments
      REDIS_URL: redis://localhost:6379/0
      API_V1_PREFIX: /api/v1
      CORS_ORIGINS: http://localhost:3000
      JWT_ALGORITHM: HS256
      JWT_ISSUER: udx-payments
      JWT_AUDIENCE: udx-payments-api
      JWT_ACCESS_MINUTES: 15
      JWT_REFRESH_DAYS: 7
      JWT_MFA_CHALLENGE_MINUTES: 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --upgrade pip
      - run: pip install '.[dev]'
      - run: ruff check .
      - run: alembic upgrade head
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install
      - run: npm run build
